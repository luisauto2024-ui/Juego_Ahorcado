<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Juego Ahorcado</title>
    </head>
    <body>
        <div class="contenedor">
            <h1 class="titulo">Juego Ahorcado</h1>
            <div class="cuadroJuego">
                <div class="palabraAdivinar">_ _ _ _ _</div>

                <div class="intentos">
                    N. Intentos
                    <p class="numIntentos">
                        5
                    </p>
                </div>

                <div class="contenedorFigura"></div>

            </div>

            <div class="contenedorPalabra">
                
                <input type="password" placeholder="Ingrese PALABRA">
                <button class="btnIngresarPalabra">Ingrese palabra</button>
            </div>

            <div class="contenedorLetra">
                <input type="text" placeholder="Ingrese una letra: ">
                <button class="btnIngresarletra">Ingrese letra</button>
            </div>

            
            
            <button class="btnReiniciar">Volver a Jugar</button>
            
            
        </div>

        <audio class="musica" src="callme.mp3" autoplay loop>Escuchar Musica</audio>
        
        <script src="app.js"></script>
    </body>
</html>
